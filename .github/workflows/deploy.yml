name: Deploy to Mac mini

# Runs on the self-hosted runner installed on the Mac mini itself (see
# deploy/README.md), so no inbound network access to the mini is needed.
#
# SECURITY: this repo is public and has a self-hosted runner attached.
# NEVER add a `pull_request` or `pull_request_target` trigger to this (or
# any) workflow in this repo — that lets anyone's fork PR run code on the
# Mac mini with zero merge required. `push` (to a protected branch only
# people with write access can reach) and `workflow_dispatch` are the only
# safe triggers here. See deploy/README.md.
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Write VERSION
        run: echo "v$(date +%Y.%m.%d)-$(git rev-parse --short HEAD)" > VERSION

      - name: Sync code into the live app directory
        run: |
          rsync -av \
            --exclude='backend/.venv/' --exclude='__pycache__/' \
            --include='backend/***' \
            --exclude='frontend/node_modules/' --exclude='frontend/dist/' \
            --include='frontend/***' \
            --include='README.md' --include='VERSION' \
            --exclude='*' \
            "$GITHUB_WORKSPACE"/ "$HOME/job-search-agent/"

      - name: Install backend dependencies
        run: |
          cd "$HOME/job-search-agent/backend"
          source .venv/bin/activate
          pip install -q -r requirements.txt

      # Requires Node installed system-wide (Homebrew) on the mini, not via
      # nvm — nvm only puts node/npm on PATH inside an interactive shell
      # that sources ~/.zshrc, and this `run:` step (like launchd) doesn't
      # go through one. See deploy/README.md.
      - name: Install frontend dependencies and build
        run: |
          cd "$HOME/job-search-agent/frontend"
          npm ci
          npm run build

      - name: Restart the backend + frontend services
        run: |
          sudo launchctl kickstart -k system/com.antoine.jobsearchagent-backend
          sudo launchctl kickstart -k system/com.antoine.jobsearchagent-frontend
